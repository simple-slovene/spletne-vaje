<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Slovene - Vaja 3</title>
<style>
body{margin:0;background:#f3f7f4;font-family:Arial,sans-serif;color:#2d2d2d}
.container{max-width:1100px;margin:40px auto;padding:20px}
h1{text-align:center;color:#2d7a50}
.instructions{text-align:center;color:#555;font-size:22px;margin-bottom:20px}
.progress-wrap{background:#dfe9e1;height:18px;border-radius:20px;overflow:hidden;margin:20px 0 30px}
.progress{background:#56a56c;height:100%;width:0;transition:.3s}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.col{background:#fff;border-radius:18px;padding:18px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.col h2{text-align:center;color:#2d7a50}
.drop{min-height:260px;border:2px dashed #56a56c;border-radius:12px;padding:10px}
.drop.active{box-shadow:0 0 0 3px #9bd2aa inset}
.words{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:25px 0}
.word{background:#fff;padding:10px 16px;border-radius:12px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.08);user-select:none}
.word.selected{background:#56a56c;color:#fff}
.correct{border:3px solid #1f9b45}.wrong{border:3px solid #d63b3b}
.footer{text-align:center}
button,a.btn{border:none;border-radius:14px;padding:11px 18px;background:#56a56c;color:#fff;margin:6px;cursor:pointer;text-decoration:none;display:inline-block}
.secondary{background:#8aa59a}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<h1>Simple Slovene</h1>
<div class="instructions">Kliknite odgovor, nato kliknite ustrezen stolpec.</div>
<div class="progress-wrap"><div class="progress" id="progress"></div></div>

<div class="words" id="words">
<div class="word">moški</div><div class="word">miza</div><div class="word">srce</div>
<div class="word">pes</div><div class="word">okno</div><div class="word">ženska</div>
<div class="word">drevo</div><div class="word">hiša</div><div class="word">robot</div>
</div>

<div class="cols">
<div class="col"><h2>Moški spol</h2><div class="drop" data-g="m"></div></div>
<div class="col"><h2>Ženski spol</h2><div class="drop" data-g="z"></div></div>
<div class="col"><h2>Srednji spol</h2><div class="drop" data-g="s"></div></div>
</div>

<div class="footer">
<h2 id="score">0 / 9 pravilno</h2>
<button onclick="checkGame()">✓ Preverite</button>
<button class="secondary" onclick="resetGame()">↺ Začnite znova</button>
<a id="next" class="btn" href="https://24ur.com" style="display:none">➡ Naprej</a>
</div>
</div>

<script>
const map={"moški":"m","pes":"m","robot":"m","miza":"z","ženska":"z","hiša":"z","srce":"s","okno":"s","drevo":"s"};
const words=document.getElementById("words");
let selected=null;
[...words.children].sort(()=>Math.random()-0.5).forEach(x=>words.appendChild(x));

document.querySelectorAll(".word").forEach(w=>{
 w.onclick=()=>{
  document.querySelectorAll(".word").forEach(x=>x.classList.remove("selected"));
  selected=w;
  w.classList.add("selected");
  document.querySelectorAll(".drop").forEach(d=>d.classList.add("active"));
 };
});

document.querySelectorAll(".drop").forEach(d=>{
 d.onclick=()=>{
   if(!selected)return;
   d.appendChild(selected);
   selected.classList.remove("selected");
   selected=null;
   document.querySelectorAll(".drop").forEach(x=>x.classList.remove("active"));
   update();
 };
});

function update(){
 let p=document.querySelectorAll(".drop .word").length;
 progress.style.width=(p/9*100)+"%";
}

function victory(){
 const ctx=new(window.AudioContext||window.webkitAudioContext)();
 [523,659,784,1047,1319].forEach((f,i)=>{
  const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*0.1;
  o.type="triangle";o.frequency.value=f;
  o.connect(g);g.connect(ctx.destination);
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(.18,t+.02);
  g.gain.exponentialRampToValueAtTime(.0001,t+.18);
  o.start(t);o.stop(t+.19);
 });
}
function fail(){
 const ctx=new(window.AudioContext||window.webkitAudioContext)();
 const o=ctx.createOscillator(),g=ctx.createGain();
 o.type="triangle";o.frequency.setValueAtTime(260,ctx.currentTime);
 o.frequency.linearRampToValueAtTime(170,ctx.currentTime+.35);
 o.connect(g);g.connect(ctx.destination);
 g.gain.setValueAtTime(.18,ctx.currentTime);
 g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.35);
 o.start();o.stop(ctx.currentTime+.35);
}

function checkGame(){
 let c=0;
 document.querySelectorAll(".drop").forEach(d=>{
   d.classList.remove("correct","wrong");
   let ok=true;
   [...d.children].forEach(w=>{if(map[w.textContent]!==d.dataset.g)ok=false;else c++;});
   d.classList.add(ok?"correct":"wrong");
 });
 score.textContent=c+" / 9 pravilno";
 if(c===9){victory();next.style.display="inline-block";}
 else{fail();next.style.display="none";}
}

function resetGame(){
 document.querySelectorAll(".drop").forEach(d=>{
   d.classList.remove("correct","wrong");
   while(d.firstChild)words.appendChild(d.firstChild);
 });
 [...words.children].sort(()=>Math.random()-0.5).forEach(x=>words.appendChild(x));
 document.querySelectorAll(".word").forEach(w=>w.classList.remove("selected"));
 selected=null;
 document.querySelectorAll(".drop").forEach(d=>d.classList.remove("active"));
 progress.style.width="0%";
 score.textContent="0 / 9 pravilno";
 next.style.display="none";
}
</script>
</body>
</html>
