<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Slovene - Poslušanje</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f7f4;margin:0;color:#333}
.container{max-width:900px;margin:30px auto;padding:20px}
h1{text-align:center;color:#2d7a50}
.instructions{text-align:center;font-size:24px;margin:20px 0}
.progress-wrap{height:18px;background:#dfe9e1;border-radius:20px;overflow:hidden;margin:25px 0}
.progress{height:100%;width:0;background:#56a56c;transition:.3s}
iframe{width:100%;aspect-ratio:16/9;border:none;border-radius:12px}
.lyrics{background:#fff;padding:25px;border-radius:14px;box-shadow:0 4px 10px rgba(0,0,0,.08);font-size:24px;line-height:2}
input{font-size:22px;padding:6px 10px;border:2px solid #bbb;border-radius:8px;width:180px}
.correct{border-color:#1f9b45;background:#ecfff1}
.wrong{border-color:#d63b3b;background:#fff1f1}
.footer{text-align:center;margin-top:25px}
button,a.btn{padding:12px 22px;border:none;border-radius:12px;background:#56a56c;color:#fff;cursor:pointer;text-decoration:none;font-size:18px}
a.btn{display:none}
.score{font-size:22px;margin:20px}
</style>
</head>
<body>
<div class="container">
<h1>Simple Slovene</h1>
<div class="instructions">Poslušajte in dopolnite.</div>

<iframe src="https://www.youtube.com/embed/cCCzBILA91w"
allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
allowfullscreen></iframe>

<div class="progress-wrap"><div id="progress" class="progress"></div></div>

<div class="lyrics">
<input id="a1" autocomplete="off"> življenje,<br><br>
<input id="a2" autocomplete="off"> negativa,<br><br>
kaj bo jutri ne vem,<br>
a ta moment tukaj šteje.
</div>

<div class="footer">
<div id="score" class="score">0 / 2 pravilno</div>
<button onclick="checkAnswers()">✓ Preverite</button>
<a class="btn" id="nextBtn" href="https://www.24ur.com">➡ Naprej</a>
</div>
</div>

<script>
const answers=[
{id:"a1",answer:"dobro jutro"},
{id:"a2",answer:"lahko noč"}
];

document.querySelectorAll("input").forEach(i=>{
 i.addEventListener("input",updateProgress);
});

function updateProgress(){
 let filled=0;
 document.querySelectorAll("input").forEach(i=>{if(i.value.trim()!=="")filled++;});
 document.getElementById("progress").style.width=(filled/answers.length*100)+"%";
}

function beep(ok){
 const ctx=new(window.AudioContext||window.webkitAudioContext)();
 const o=ctx.createOscillator(),g=ctx.createGain();
 o.type="triangle";
 o.frequency.value=ok?700:220;
 o.connect(g);g.connect(ctx.destination);
 g.gain.setValueAtTime(.18,ctx.currentTime);
 g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.25);
 o.start();o.stop(ctx.currentTime+.25);
}

function checkAnswers(){
 let c=0;
 answers.forEach(x=>{
   const el=document.getElementById(x.id);
   el.classList.remove("correct","wrong");
   if(el.value.trim().toLowerCase()===x.answer){
      el.classList.add("correct"); c++;
   }else{
      el.classList.add("wrong");
   }
 });
 document.getElementById("score").textContent=c+" / 2 pravilno";
 if(c===answers.length){
   beep(true);
   document.getElementById("nextBtn").style.display="inline-block";
 }else{
   beep(false);
   document.getElementById("nextBtn").style.display="inline-block";
   document.getElementById("nextBtn").style.display="none";
 }
}
</script>
</body>
</html>
