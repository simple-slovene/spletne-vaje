<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Slovene</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:Arial,Helvetica,sans-serif;background:#f5f7fa;color:#333}

.hero{position:relative}
.hero img{width:100%;display:block}

.scroll-arrow{
position:absolute;
left:50%;
bottom:20px;
transform:translateX(-50%);
width:64px;
height:64px;
border-radius:50%;
background:rgba(255,255,255,.85);
display:flex;
align-items:center;
justify-content:center;
font-size:40px;
text-decoration:none;
color:#1b2b45;
box-shadow:0 4px 15px rgba(0,0,0,.3);
animation:bounce 1.8s infinite;
transition:.3s;
}
.scroll-arrow:hover{
background:#fff;
transform:translateX(-50%) scale(1.08);
}
@keyframes bounce{
0%,20%,50%,80%,100%{transform:translateX(-50%) translateY(0)}
40%{transform:translateX(-50%) translateY(-10px)}
60%{transform:translateX(-50%) translateY(-5px)}
}

.content{max-width:980px;margin:0 auto;padding:50px 24px 60px;text-align:center;background:#fff}
h1{font-size:52px;color:#1b2b45;margin-bottom:24px}
.lead{font-size:22px;line-height:1.7;max-width:900px;margin:0 auto 30px}
.text{font-size:20px;line-height:1.8;color:#555;margin-bottom:50px}
.start{display:block;max-width:900px;margin:0 auto;background:#d84343;color:#fff;
text-decoration:none;font-size:34px;font-weight:bold;padding:22px;border-radius:8px}
.start:hover{background:#bf3232}
@media(max-width:768px){
h1{font-size:36px}
.lead{font-size:19px}
.text{font-size:18px}
.start{font-size:28px;padding:18px}
}
</style>
</head>
<body>

<div class="hero">
<img src="https://simple-slovene.github.io/spletne-vaje/slike/Naslovnica2.png" alt="Simple Slovene">
<a href="#start" class="scroll-arrow">↓</a>
</div>

<div class="content">
<h1>Learn Slovene for real life.</h1>

<div class="lead">
Learn how to speak Slovene in everyday situations—at work, in the shop, at the doctor's, on the bus, or with friends.
</div>

<div class="text">
No long grammar lessons.<br>
No confusing rules.<br>
Just practical Slovene you can start using today.
</div>

<a id="start" class="start" href="https://simple-slovene.github.io/spletne-vaje/KAZALO.html" target="_blank">START</a>

</div>

</body>
</html>
