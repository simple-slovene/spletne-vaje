<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Slovene - Povežite levo in desno</title>
<style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f7f4;color:#2d2d2d}
.container{max-width:1100px;margin:40px auto;padding:20px}
h1{text-align:center;color:#2d7a50}
.instructions{text-align:center;color:#555;font-size:22px;margin-bottom:20px}
.progress-wrap{background:#dfe9e1;height:18px;border-radius:20px;overflow:hidden;margin:25px 0 35px}
.progress{background:#56a56c;width:0;height:100%;transition:.3s}
.game{display:grid;grid-template-columns:1fr 220px 1fr;gap:20px;align-items:start}
.column{display:flex;flex-direction:column;gap:16px}
.card{background:#fff;border-radius:14px;padding:16px;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,.08);font-size:22px}
.dropzone{min-height:28px;margin-top:10px;border:2px dashed #56a56c;border-radius:10px;padding:8px;background:#eef8f1}
.word{background:#fff;padding:14px;border-radius:14px;cursor:move;box-shadow:0 4px 10px rgba(0,0,0,.08);text-align:center;font-size:20px}
.correct{border:3px solid #1f9b45}
.wrong{border:3px solid #d63b3b}
.footer{text-align:center;margin-top:30px}
button{padding:12px 20px;border:none;border-radius:14px;background:#56a56c;color:#fff;margin:5px;cursor:pointer}
.secondary{background:#8aa59a}
@media(max-width:900px){.game{grid-template-columns:1fr}.middle{order:2}}
</style>
</head>
<body>
<div class="container">
<h1>Simple Slovene</h1>
<div class="instructions">Povežite levo in desno.</div>
<div class="progress-wrap"><div class="progress" id="progress"></div></div>

<div class="game">
<div class="column">
<div class="card">Živjo!<div class="dropzone" data-answer="Zdravo!"></div></div>
<div class="card">Nasvidenje!<div class="dropzone" data-answer="Adijo!"></div></div>
<div class="card">Kako ste?<div class="dropzone" data-answer="Dobro, hvala!"></div></div>
<div class="card">Hvala.<div class="dropzone" data-answer="Prosim."></div></div>
<div class="card">Jaz sem Vanda.<div class="dropzone" data-answer="Me veseli!"></div></div>
</div>

<div class="middle"></div>

<div class="column" id="words">
<div class="word" draggable="true" id="Zdravo!">Zdravo!</div>
<div class="word" draggable="true" id="Adijo!">Adijo!</div>
<div class="word" draggable="true" id="Dobro, hvala!">Dobro, hvala!</div>
<div class="word" draggable="true" id="Prosim.">Prosim.</div>
<div class="word" draggable="true" id="Me veseli!">Me veseli!</div>
</div>
</div>

<div class="footer">
<h2 id="score">0 / 5 pravilno</h2>
<button onclick="checkAnswers()">✓ Preverite</button>
<button class="secondary" onclick="resetGame()">↺ Začnite znova</button>
<button id="nextButton" style="display:none">➡ Naslednja vaja</button>
</div>
</div>

<script>
let dragged=null;
const words=document.getElementById("words");
function shuffle(){[...words.children].sort(()=>Math.random()-0.5).forEach(x=>words.appendChild(x))}
shuffle();
document.querySelectorAll(".word").forEach(w=>w.addEventListener("dragstart",()=>dragged=w));
document.querySelectorAll(".dropzone").forEach(z=>{
 z.addEventListener("dragover",e=>e.preventDefault());
 z.addEventListener("drop",e=>{
  e.preventDefault();
  if(!dragged)return;
  if(z.firstChild)words.appendChild(z.firstChild);
  z.appendChild(dragged);
  updateProgress();
 });
});
function updateProgress(){
 let p=document.querySelectorAll(".dropzone .word").length;
 document.getElementById("progress").style.width=(p/5*100)+"%";
}
function checkAnswers(){
 let c=0;
 document.querySelectorAll(".dropzone").forEach(z=>{
  z.classList.remove("correct","wrong");
  if(z.firstChild&&z.firstChild.id===z.dataset.answer){z.classList.add("correct");c++;}
  else{z.classList.add("wrong");}
 });
 document.getElementById("score").textContent=(c===5?"🎉 Odlično! ":"⭐ ")+c+" / 5 pravilno";
 document.getElementById("nextButton").style.display="inline-block";
}
function resetGame(){
 document.querySelectorAll(".dropzone").forEach(z=>{
  z.classList.remove("correct","wrong");
  while(z.firstChild)words.appendChild(z.firstChild);
 });
 shuffle();
 updateProgress();
 document.getElementById("score").textContent="0 / 5 pravilno";
 document.getElementById("nextButton").style.display="none";
}
</script>
</body>
</html>
