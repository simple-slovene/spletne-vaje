<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Slovene - Poglavje 1</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f3f7f4;color:#333}
.container{max-width:1100px;margin:30px auto;padding:20px}
.logo{text-align:center;margin-bottom:20px}
.logo img{max-width:460px;width:100%;height:auto}
h1{text-align:center;color:#2f6f43;margin:10px 0 30px;font-size:34px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 10px rgba(0,0,0,.08);overflow:hidden}
.card img{width:100%;height:180px;object-fit:cover;display:block}
.caption{padding:16px;text-align:center;font-size:24px;font-weight:bold}
.footer{text-align:center;margin:40px 0}
.btn{display:inline-block;background:#56a56c;color:#fff;text-decoration:none;padding:14px 34px;border-radius:14px;font-size:22px}
@media(max-width:800px){
.container{padding:12px}
h1{font-size:28px}
.grid{grid-template-columns:repeat(2,1fr);gap:12px}
.card img{height:130px}
.caption{font-size:18px;padding:10px}
.btn{font-size:20px}
}
</style>
</head>
<body>
<div class="container">
<div class="logo">
<img src="https://simple-slovene.github.io/spletne-vaje/slike/Logotip.png" alt="Simple Slovene">
</div>

<h1>Poglavje 1 – Pozdravi</h1>

<div class="grid">
<div class="card"><img src="https://simple-slovene.github.io/spletne-vaje/slike/dobro_jutro.jpg"><div class="caption">Dobro jutro</div></div>
<div class="card"><img src="https://simple-slovene.github.io/spletne-vaje/slike/dober_dan.jpg"><div class="caption">Dober dan</div></div>
<div class="card"><img src="https://simple-slovene.github.io/spletne-vaje/slike/dober_vecer.jpg"><div class="caption">Dober večer</div></div>
<div class="card"><img src="https://simple-slovene.github.io/spletne-vaje/slike/nasvidenje.jpg"><div class="caption">Nasvidenje</div></div>
<div class="card"><img src="https://simple-slovene.github.io/spletne-vaje/slike/lahko_noc.png"><div class="caption">Lahko noč</div></div>
<div class="card"><img src="https://simple-slovene.github.io/spletne-vaje/slike/zivjo2.png"><div class="caption">Živjo</div></div>
<div class="card"><img src="https://simple-slovene.github.io/spletne-vaje/slike/nasvidenje.jpg"><div class="caption">Adijo</div></div>
<div class="card"><img src="https://simple-slovene.github.io/spletne-vaje/slike/me_veseli.jpg"><div class="caption">Hvala</div></div>
</div>

<div class="footer">
<a class="btn" href="https://simple-slovene.github.io/spletne-vaje/poglavje1/vaja1.html">Vaje</a>
</div>

</div>
</body>
</html>
