<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Simple Slovene - Pozdravi</title>

<style>

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f3f7f4;
color:#333;
}

.container{
max-width:1100px;
margin:40px auto;
padding:20px;
}

.logo{
text-align:center;
margin-bottom:20px;
}

.logo img{
width:100%;
max-width:460px;
display:block;
margin:auto;
}

.instructions{
text-align:center;
font-size:26px;
margin-bottom:20px;
font-weight:normal;
}

.progress-wrap{
height:18px;
background:#dfe9e1;
border-radius:20px;
overflow:hidden;
margin-bottom:30px;
}

.progress{
width:0;
height:100%;
background:#56a56c;
transition:.3s;
}

.images{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
}

.card{
background:#fff;
padding:20px;
border-radius:18px;
box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.picture{
width:100%;
height:180px;
object-fit:cover;
border-radius:12px;
}

.slot{
margin-top:12px;
min-height:48px;
border:2px dashed #56a56c;
border-radius:12px;
background:#eef8f1;
display:flex;
align-items:center;
justify-content:center;
}

.slot.correct{
border:3px solid #1b9e44;
}

.slot.wrong{
border:3px solid #d64040;
}

.placeholder{
font-style:italic;
font-weight:300;
opacity:.45;
pointer-events:none;
}

.words{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:14px;
margin-bottom:25px;
}

.word{
background:#fff;
padding:12px 16px;
border-radius:14px;
box-shadow:0 4px 10px rgba(0,0,0,.08);
cursor:pointer;
font-size:20px;
text-align:center;
}

.word.selected{
background:#56a56c;
color:#fff;
}

.footer{
text-align:center;
margin-top:35px;
}

button{
padding:12px 24px;
border:none;
border-radius:14px;
background:#56a56c;
color:#fff;
margin:6px;
}

.secondary{
background:#8aa59a;
}

#nextButton{
display:none;
}

@media(max-width:900px){

.container{
padding:12px;
}

.images{
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.picture{
height:120px;
}

.card{
padding:12px;
}

.slot{
height:42px;
font-size:16px;
}

.words{
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.word{
font-size:17px;
padding:10px;
}

.instructions{
font-size:20px;
}

}

</style>
</head>

<body>

<div class="container">

<h1 class="logo">
<img src="https://simple-slovene.github.io/spletne-vaje/slike/Logotip.png">
</h1>

<div class="instructions">
Vaja 2 - Najprej izberite pozdrav, potem pritisnite prazen prostor.
</div>

<div class="progress-wrap">
<div class="progress" id="progress"></div>
</div>

<div class="words" id="words"></div>

<div class="images">

<div class="card">
<img class="picture" src="https://simple-slovene.github.io/spletne-vaje/slike/lahko_noc.png">
<div class="slot" data-answer="Lahko noč">
<span class="placeholder">prazen prostor</span>
</div>
</div>

<div class="card">
<img class="picture" src="https://simple-slovene.github.io/spletne-vaje/slike/dobro_jutro.jpg">
<div class="slot" data-answer="Dobro jutro">
<span class="placeholder">prazen prostor</span>
</div>
</div>

<div class="card">
<img class="picture" src="https://simple-slovene.github.io/spletne-vaje/slike/nasvidenje.jpg">
<div class="slot" data-answer="Nasvidenje">
<span class="placeholder">prazen prostor</span>
</div>
</div>

<div class="card">
<img class="picture" src="https://simple-slovene.github.io/spletne-vaje/slike/dober_vecer.jpg">
<div class="slot" data-answer="Dober večer">
<span class="placeholder">prazen prostor</span>
</div>
</div>

</div>

<div class="footer">

<h2 id="score">0 / 4 pravilno</h2>

<button onclick="checkAnswers()">✓ Preverite</button>

<button class="secondary" onclick="resetGame()">↺ Začnite znova</button>

<button id="nextButton"
onclick="location.href='https://simple-slovene.github.io/spletne-vaje/poglavje1/vaja3.html'">
➡ Naprej
</button>

</div>

</div>

<script>

const vals=[
"Lahko noč",
"Dobro jutro",
"Nasvidenje",
"Dober večer"
];

const wc=document.getElementById("words");
const progress=document.getElementById("progress");

let sel=null;

function fill(){

wc.innerHTML="";

[...vals]
.sort(()=>Math.random()-0.5)
.forEach(v=>{

let d=document.createElement("div");

d.className="word";
d.dataset.value=v;
d.textContent=v;

d.onclick=()=>{

document.querySelectorAll(".word")
.forEach(x=>x.classList.remove("selected"));

if(sel===d){
sel=null;
return;
}

sel=d;
d.classList.add("selected");

};

wc.appendChild(d);

});

}

fill();

document.querySelectorAll(".slot").forEach(s=>{

s.onclick=()=>{

if(!sel)return;

const ph=s.querySelector(".placeholder");
if(ph)ph.remove();

const old=s.querySelector(".word");

if(old){
wc.appendChild(old);
}

document.querySelectorAll(".word")
.forEach(x=>x.classList.remove("selected"));

s.appendChild(sel);

sel=null;

progress.style.width=
(document.querySelectorAll(".slot .word").length/4*100)+"%";

};

});

function successSound(){

const c=new(window.AudioContext||window.webkitAudioContext)();

[523,659,784,1047].forEach((f,i)=>{

const o=c.createOscillator();
const g=c.createGain();

o.type="triangle";
o.frequency.value=f;

o.connect(g);
g.connect(c.destination);

let t=c.currentTime+i*.08;

g.gain.setValueAtTime(.0001,t);
g.gain.exponentialRampToValueAtTime(.18,t+.02);
g.gain.exponentialRampToValueAtTime(.0001,t+.18);

o.start(t);
o.stop(t+.19);

});

}

function failSound(){

const c=new(window.AudioContext||window.webkitAudioContext)();

const o=c.createOscillator();
const g=c.createGain();

o.type="triangle";

o.frequency.setValueAtTime(260,c.currentTime);
o.frequency.linearRampToValueAtTime(170,c.currentTime+.35);

o.connect(g);
g.connect(c.destination);

g.gain.setValueAtTime(.18,c.currentTime);
g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.35);

o.start();
o.stop(c.currentTime+.35);

}

function checkAnswers(){

let ok=0;

document.querySelectorAll(".slot").forEach(s=>{

s.classList.remove("correct","wrong");

const w=s.querySelector(".word");

if(w && w.dataset.value===s.dataset.answer){

s.classList.add("correct");
ok++;

}else{

s.classList.add("wrong");

}

});

score.textContent=ok+" / 4 pravilno";

if(ok===4){

successSound();

nextButton.style.display="inline-block";

}else{

failSound();

nextButton.style.display="none";

}

}

function resetGame(){

document.querySelectorAll(".slot").forEach(s=>{

s.classList.remove("correct","wrong");

const w=s.querySelector(".word");

if(w){
wc.appendChild(w);
}

s.innerHTML='<span class="placeholder">prazen prostor</span>';

});

document.querySelectorAll(".word")
.forEach(x=>x.classList.remove("selected"));

sel=null;

fill();

progress.style.width="0%";

score.textContent="0 / 4 pravilno";

nextButton.style.display="none";

}

</script>

</body>
</html>
