<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Slovene</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f7f4;margin:0;color:#333}
.container{max-width:900px;margin:20px auto;padding:16px}
.logo img{width:100%;max-width:460px;display:block;margin:auto}
.instructions{text-align:center;font-size:22px;margin:20px 0}
.progress-wrap{height:18px;background:#dfe9e1;border-radius:20px;overflow:hidden;margin-bottom:20px}
.progress{height:100%;width:0;background:#56a56c}
#bank{display:grid;grid-template-columns:repeat(2,minmax(120px,1fr));gap:10px;margin-bottom:24px}
.word{background:#fff;border-radius:12px;padding:14px;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,.08);cursor:pointer}
.word.selected{background:#56a56c;color:#fff}
.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 4px 10px rgba(0,0,0,.08);margin-bottom:14px}
.dropzone{margin-top:10px;min-height:42px;border:2px dashed #56a56c;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#eef8f1}
.dropzone.active{box-shadow:0 0 0 3px #9bd2aa inset}
.correct{border:3px solid #1f9b45}.wrong{border:3px solid #d63b3b}
.footer{text-align:center;margin-top:20px}
button,a.btn{padding:12px 20px;border:none;border-radius:12px;background:#56a56c;color:#fff;text-decoration:none;display:inline-block;margin:5px}
</style>
</head>
<body>
<div class="container">
<div class="logo"><img src="https://simple-slovene.github.io/spletne-vaje/slike/Logotip.png"></div>
<div class="instructions">Vaja 9 - Dopolnite dialog.</div>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>

<div id="bank">
<div class="word">Me veseli!</div>
<div class="word">Tako tako.</div>
<div class="word">Ime mi je Tilen.</div>
<div class="word">Pišem se Pogačar.</div>
<div class="word">Zdravo!</div>
</div>

<div class="card">Dober dan.<div class="dropzone" data-answer="Zdravo!"></div></div>
<div class="card">Ime mi je dr.Vanda.<div class="dropzone" data-answer="Me veseli!"></div></div>
<div class="card">Kako vam je ime?<div class="dropzone" data-answer="Ime mi je Tilen."></div></div>
<div class="card">Kako se pišete?<div class="dropzone" data-answer="Pišem se Pogačar."></div></div>
<div class="card">Kako ste?<div class="dropzone" data-answer="Tako tako."></div></div>

<div class="footer">
<h2 id="score">0 / 5 pravilno</h2>
<button onclick="checkAnswers()">✓ Preverite</button>
<button id="resetBtn" onclick="resetGame()" style="display:none">↺ Začnite znova</button>



<a id="nextBtn" class="btn" href="https://simple-slovene.github.io/spletne-vaje/poglavje1/vaja10.html" style="display:none">➡ Naprej</a>
</div>

<script>
const bank=document.getElementById('bank');let selected=null;
[...bank.children].sort(()=>Math.random()-0.5).forEach(x=>bank.appendChild(x));
document.querySelectorAll('.word').forEach(w=>w.onclick=()=>{document.querySelectorAll('.word').forEach(x=>x.classList.remove('selected'));selected=w;w.classList.add('selected');document.querySelectorAll('.dropzone').forEach(z=>z.classList.add('active'));});
document.querySelectorAll('.dropzone').forEach(z=>z.onclick=()=>{if(!selected)return;if(z.firstChild)bank.appendChild(z.firstChild);z.appendChild(selected);selected.classList.remove('selected');selected=null;document.querySelectorAll('.dropzone').forEach(d=>d.classList.remove('active'));updateProgress();});
function updateProgress(){progress.style.width=(document.querySelectorAll('.dropzone .word').length/5*100)+'%';}
function playVictory(){const c=new(window.AudioContext||window.webkitAudioContext)();[523,659,784,1046].forEach((f,i)=>{let o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;let t=c.currentTime+i*.1;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.15,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.start(t);o.stop(t+.19);});}
function playFail(){const c=new(window.AudioContext||window.webkitAudioContext)();let o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.setValueAtTime(260,c.currentTime);o.frequency.linearRampToValueAtTime(170,c.currentTime+.35);g.gain.setValueAtTime(.18,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.35);o.start();o.stop(c.currentTime+.35);}
function checkAnswers(){let ok=0;document.querySelectorAll('.dropzone').forEach(z=>{z.classList.remove('correct','wrong');if(z.firstChild&&z.firstChild.textContent===z.dataset.answer){z.classList.add('correct');ok++;}else z.classList.add('wrong');});score.textContent=ok+' / 5 pravilno';if(ok==5){playVictory();nextBtn.style.display='inline-block';resetBtn.style.display='none';}else{playFail();nextBtn.style.display='none';resetBtn.style.display='inline-block';}}
function resetGame(){document.querySelectorAll('.dropzone').forEach(z=>{z.classList.remove('correct','wrong');while(z.firstChild)bank.appendChild(z.firstChild)});[...bank.children].sort(()=>Math.random()-0.5).forEach(x=>bank.appendChild(x));document.querySelectorAll('.word').forEach(w=>w.classList.remove('selected'));selected=null;score.textContent='0 / 5 pravilno';progress.style.width='0%';nextBtn.style.display='none';resetBtn.style.display='none';}
</script>
</div>
</body>
</html>
